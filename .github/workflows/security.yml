name: Security

on:
  push:
    branches: [ master, dev/master ]
  pull_request:
    # Retargeting a PR emits edited rather than synchronize.
    types: [ opened, synchronize, reopened, edited ]
    branches: [ master, dev/master ]
  schedule:
    # Monday 05:00 UTC: catches advisories published against code nobody has
    # touched in the meantime.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
