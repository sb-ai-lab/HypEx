name: Security

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Monday 05:00 UTC: catches advisories published against code nobody has
    # touched in the meantime.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: poetry.lock

      - run: python -m pip install tox

      # Advisory for now. The locked set currently carries 36 known
      # advisories, almost all in pillow (pinned transitively by
      # matplotlib<=3.9.0) and urllib3. None of them are fixable without
      # moving those bounds, so a blocking job here would only ever be red.
      # Drop continue-on-error once that backlog is triaged; Dependabot is
      # what should be driving it down in the meantime.
      - run: tox -e audit
        continue-on-error: true
