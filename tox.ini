[tox]
min_version = 3.28.0
isolated_build = True
envlist =
    py{38,39,310,311,312,313},
    lint,
    typing,
    codespell,
    docs,
    build

[tox:.package]
basepython = python3

# Consumed by tox-gh-actions, which is installed ONLY in the test-matrix job.
# Any job that needs a specific environment must call `tox -e <env>` and must
# not install tox-gh-actions: the plugin rewrites envlist from this table, so
# a bare `tox` under GitHub Actions runs the interpreter's test env and
# nothing else.
[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
description = Run the test suite
package = wheel
extras = all
deps =
    pytest >= 6.2.5
    psutil >= 7.0.0
    alive-progress >= 3.1.0
    jsonschema >= 4.23.0
commands =
    pytest {posargs} --basetemp="{envtmpdir}"

[testenv:coverage]
description = Run the test suite and report coverage
package = wheel
extras = all
deps =
    {[testenv]deps}
    pytest-cov >= 4.0.0
commands =
    pytest {posargs} --basetemp="{envtmpdir}" \
        --cov=hypex --cov-report=term-missing --cov-report=xml

[testenv:lint]
skip_install = true
description = Lint and check formatting with Ruff
deps =
    ruff == 0.16.6
# No --fix: CI must report on the committed code, not silently rewrite a
# throwaway checkout and exit 0. Ignores live in pyproject.toml.
commands =
    ruff check .
    ruff format --check .

[testenv:typing]
skip_install = true
description = Run type checks with mypy
deps =
    mypy == 1.18.2
    pandas-stubs
    pytest
    types-pytz
    types-tqdm
    types-requests
    types-pyyaml
# Fails honestly. The CI job is advisory (continue-on-error) until the
# existing backlog is burned down; flip it to blocking after that.
commands =
    mypy {posargs:hypex}

[testenv:codespell]
skip_install = true
description = Check for spelling errors
deps =
    codespell == 2.4.3
commands =
    codespell --skip="docs,_build,imgs,schemes,poetry.lock,*.ipynb" \
        --ignore-words-list="dotA,TE,te,TTest"

[testenv:docs]
description = Build documentation using Sphinx
changedir = docs
extras = all
deps =
    sphinx >= 5.3.0
    sphinx-autodoc-typehints >= 1.19.5
    sphinx-rtd-theme >= 1.1.1
    nbsphinx >= 0.8.10
    nbsphinx-link >= 1.3.0
    doc8 >= 0.10.1
    rstcheck >= 3.3.1
    ipykernel >= 6.0
    IPython >= 7.0
commands =
    sphinx-build -b html -W --keep-going . _build/html
    doc8 . --ignore-path _autosummary --ignore-path _build --ignore-path _templates

[testenv:notebooks]
description = Execute the tutorial notebooks end to end
extras = all
deps =
    pytest >= 6.2.5
    nbmake >= 1.4.0
    ipykernel >= 6.0
    jupyter >= 1.0
commands =
    pytest --nbmake --nbmake-timeout=1200 {posargs:examples/tutorials}

[testenv:build]
skip_install = true
description = Build the distribution and validate its metadata
deps =
    poetry >= 2.0
    twine >= 4.0
commands =
    poetry build
    twine check dist/*

# Audits the locked dependency set exported from poetry.lock. Auditing the
# environment instead would report pip, setuptools and wheel -- the
# virtualenv's own bootstrap packages, which say nothing about this project
# and would keep the job permanently red.
[testenv:audit]
skip_install = true
description = Report known vulnerabilities in the locked dependencies
deps =
    poetry >= 2.0
    poetry-plugin-export >= 1.8
    pip-audit >= 2.7.0
commands =
    poetry export --format requirements.txt --output {envtmpdir}/requirements.txt \
        --with dev --all-extras --without-hashes
    pip-audit --requirement {envtmpdir}/requirements.txt {posargs}
