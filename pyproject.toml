[tool.poetry]
name = "HypEx"
version = "2.0.0a1"
description = "Fast and customizable framework for Causal Inference"
authors = [
    "Dmitry Tikhomirov <dimasta00@gmail.com>",
    "Dmitry Bulychev <dmatryus.sqrt49@yandex.ru>",
    "Ivan Yurashku <yurashku@gmail.com>",
    "Anton Katkov <akatkov89@gmail.com>",
    "Ruslan Alsherov <ruslan-alsherov@yandex.ru>",
    "Ksenia Vasilieva <vasilievaxeniaa@gmail.com>",
    "Anastasiia Fedorova <fedorovanasty24@gmail.com>",
    "Daria Vigovskaya <dasha.vig@yandex.ru>",
    "Danil Shamsutdinov <a.danil.dark@gmail.com>",
    "Eric Ulmaskulov <ulmaskuloverik@gmail.com>"
]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/sb-ai-lab/HypEx"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
# Three ABI-lines:
#   py3.8       — legacy: numpy 1.24 / pandas 2.0 / matplotlib 3.7
#   py3.9–3.11  — Spark: numpy<2, as pyspark 3.5 uses np.NaN,
#                 and pyarrow 15 pins numpy<2 bu itself
#   py3.12–3.13 — without Spark: numpy 2 and fresh numeric-stack
python = ">=3.8,<3.14"
tqdm         = ">=4.66,<5"
scikit-learn = ">=1.3.2,<2"
typing_extensions = { version = ">=4.12,<5", python = "<3.11" }

pandas = [
  { version = ">=1.3.5,<=2.0.3", python = "<3.9" },
  { version = ">=2.0.3,<2.3",    python = ">=3.9,<3.12" },
  { version = ">=2.2.3,<3.0",    python = ">=3.12" },
]

numpy = [
  { version = ">=1.17.0,<=1.24.4", python = "<3.9" },
  { version = ">=1.26.4,<2.0",     python = ">=3.9,<3.12" },
  { version = ">=2.1,<3",          python = ">=3.12" },
]

scipy = [
  { version = ">=1.5.0,<=1.10.1", python = "<3.9" },
  { version = ">=1.10.1,<2",      python = ">=3.9" },
]

matplotlib = [
  { version = ">=3.0.0,<3.8", python = "<3.9" },
  { version = ">=3.5,<4",     python = ">=3.9" },
]

faiss-cpu = [
  { version = ">=1.6.0,<=1.8.0", python = "<3.9" },
  { version = ">=1.9.0,<2",      python = ">=3.9" },
]
statsmodels = [
  { version = ">=0.14.1,<0.15", python = "<3.9" },
  { version = ">=0.14.2,<0.15", python = ">=3.9" },
]

pyarrow = [
  { version = ">=11.0.0,<16", python = "<3.12" },
  { version = ">=18,<23",     python = ">=3.12" },
]

seaborn = "<=0.13.2"
pyspark = {version = ">=3.5.1,<=3.5.7", optional = true }

catboost = {version = ">=1.2.7,<2", optional = true }
lightgbm = { version = ">=4.5,<5", optional = true }

[tool.poetry.extras]
cat = ["catboost"]
lgbm = ["lightgbm"]
spark = ["pyspark"]
all = ["catboost", "lightgbm", "pyspark"]

[tool.poetry.group.dev.dependencies]
pytest     = ">=8.3,<10"
pytest-cov = ">=5,<8"
mypy       = ">=1.8,<3" 
ruff       = "0.16.6"  
pre-commit = ">=3.5,<5"
psutil     = ">=7.0,<8"
jsonschema = ">=4.23,<5"
jupyter    = ">=1.0,<2"
alive-progress  = ">=3.1,<4"
causalinference = "*"


sphinx = [
  { version = ">=7.1,<8",  python = "<3.9" },
  { version = ">=7.3,<10", python = ">=3.9" },
]
sphinx_rtd_theme = [
  { version = ">=1.3,<2", python = "<3.9" },
  { version = ">=3.0,<4", python = ">=3.9" },
]
docutils = [
  { version = ">=0.17,<0.19", python = "<3.9" },
  { version = ">=0.20,<0.23", python = ">=3.9" },
]
sphinx_autodoc-typehints = ">=2.0,<4"
nbsphinx      = ">=0.9,<0.10"
nbsphinx_link = ">=1.3,<2"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py38"
# Ruff >= 0.14 also formats Python blocks inside Markdown; keep it off prose.
extend-exclude = ["docs/_build", "docs/_autosummary", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "UP", "RUF", "I"]
# E501: line length is enforced by `ruff format`, not by the linter.
# RUF001/RUF002/RUF003: strings, docstrings and comments use Greek letters and
# typographic symbols (statistical notation, "×" in shapes).
# C901: complexity is tracked, not gated.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "C901"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export names on purpose.
"__init__.py" = ["F401"]
# Tutorials start Spark in a bare try/except around optional environment setup.
"*.ipynb" = ["E722"]

[tool.codespell]
skip = ".git,.tox,.venv,.mypy_cache,.ruff_cache,docs,_build,imgs,schemes,poetry.lock,*.ipynb"
check-hidden = true
# dotA: a column name in the test fixtures. TE/te: treatment effect.
# TTest/ttest: the class name and the statistic.
ignore-words-list = "dotA,TE,te,TTest,ttest,fpr"

[tool.mypy]
python_version = "3.10"
files = ["hypex"]
exclude = "^(docs|examples|dist)/"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
# Bare `pytest` used to import everything it could find, including
# examples/experiments scripts that are not tests and break collection.
testpaths = ["tests"]
markers = [
    "spark: requires local Spark session (slow)",
    "slow: full pipeline on large data or statistical properties",
    "catboost: requires catboost to be installed",
]
filterwarnings = [
    "error::DeprecationWarning:hypex.*",
    "error::FutureWarning:hypex.*",
]

[tool.coverage.run]
source = ["hypex"]
omit = ["hypex/factory/*", "hypex/hypotheses/*"]

[tool.coverage.report]
show_missing = true
fail_under = 88
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AbstractMethodError",
]
