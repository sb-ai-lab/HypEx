[tool.poetry]
name = "HypEx"
version = "1.0.3"
description = "Fast and customizable framework for Causal Inference"
authors = [
    "Dmitry Tikhomirov <dimasta00@gmail.com>",
    "Dmitry Bulychev <dmatryus.sqrt49@yandex.ru>",
    "Ivan Yurashku <yurashku@gmail.com>",
    "Anton Katkov <akatkov89@gmail.com>",
    "Ruslan Alsherov <ruslan-alsherov@yandex.ru>",
    "Ksenia Vasilieva <vasilievaxeniaa@gmail.com>",
    "Anastasiia Fedorova <fedorovanasty24@gmail.com>",
    "Daria Vigovskaya <dasha.vig@yandex.ru>"
]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/sb-ai-lab/HypEx"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = ">=3.8, <3.14"
tqdm = "*"
scikit-learn = "*"

pandas = [
    { version = ">=1.3.5, <=2.0.3", python = "<3.9" },
    { version = ">=1.3.5, <=2.2.3", python = ">=3.9" }
]

numpy = [
    { version = ">=1.17.0, <=1.24.4", python = "<3.9" },
    { version = ">=1.17.0, <=1.26.4", python = ">=3.9" }
]

scipy = [
    { version = ">=1.5.0, <=1.10.1", python = "<3.9" },
    { version = ">=1.5.0, <=1.13.1", python = ">=3.9, <3.13" },
    { version = ">=1.14.1, <=1.16.0", python = ">=3.13" }
]

matplotlib = [
    { version = ">=3.0.0, <=3.7.3", python = "<3.9" },
    { version = ">=3.0.0, <=3.9.0", python = ">=3.9, <3.13" },
    { version = ">=3.10.0, <=3.11.0", python = ">=3.13" }
]

faiss-cpu = [
    { version = ">=1.6.0, <=1.8.0", python = "<3.9" },
    { version = ">=1.9.0,<=1.14.0", python = ">=3.9" }
]
seaborn = "<=0.13.2"
statsmodels = "<=0.14.2"
causalinference = "^0.1.3"
pyspark = "3.5.1"
pyarrow = ">=4.0.0"

[tool.poetry.extras]
cat = ["catboost"]
lgbm = ["lightgbm"]
all = ["catboost", "lightgbm"]

[tool.poetry.group.dev.dependencies]
python = "3.8.17"
docutils = ">=0.17,<0.21"
jupyter = "^1.0.0"
pytest = "^7.4.3"
sphinx = { version = "^7.2.6", python = ">=3.9, <3.11" }
nbsphinx = "*"
nbsphinx_link = "*"
sphinx_autodoc-typehints = "*"
sphinx_rtd_theme = "^1.2.2"
ruff = "*"
alive-progress = "^3.1.0"
psutil = "^7.0.0"
jsonschema = "^4.23.0"
mypy = ">=1.8.0,<1.17"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Keep line length compatible with black (already set to 88)
line-length = 88
target-version = "py38"

[tool.ruff.lint]
# Extended rule sets:
# E, W     – pycodestyle (whitespace, blank lines, etc.)
# F        – Pyflakes (syntax and logic errors)
# C90      – mccabe (cyclomatic complexity)
# UP       – pyupgrade (syntax modernization for the target version)
# RUF      – ruff-specific rules (e.g., unused noqa)
# I        – isort (import sorting)
# SIM      – simplification of expressions (yoda conditions, unnecessary if, etc.)
# PERF     – performance tips (especially useful for pandas/numpy)
# PD       – pandas-vet (pandas best practices, avoid deprecated methods)
# NPY      – numpy-specific rules (deprecated types, potential errors)
# FA       – future annotations (from __future__ import annotations)
# S        – bandit (basic security checks)
# D        – pydocstyle (docstring checks, important for public APIs)
select = [
    "E", "W", "F", "C90", "UP", "RUF", "I",
    "SIM", "PERF", "PD", "NPY", "FA", "S", "D"
]

# Ignored rules
ignore = [
    "E501",    # line length is already controlled by line-length
    "C901",    # leave function complexity without a strict limit
    "S101",    # assert in tests/examples is acceptable when intentional
    "D100",    # missing module docstring – can be skipped for internal modules
    "D104",    # missing package docstring
    "PD901",   # `df` as a variable name is normal in data analysis
]

[tool.ruff.lint.per-file-ignores]
# Allow assert and skip docstring requirements in tests and notebooks
"tests/**/*.py" = ["S101", "D"]
"docs/**/*.py" = ["D"]
"*.ipynb" = ["D"]

[tool.ruff.lint.isort]
# Import ordering: standard library, third-party, then HypEx
known-first-party = ["HypEx"]

[tool.ruff.lint.pydocstyle]
# Use Google-style (or numpy) docstrings – common in the scientific community
convention = "google"

[tool.ruff.format]
# Formatter settings, similar to black (used by default)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
