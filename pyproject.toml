[tool.poetry]
name = "HypEx"
version = "2.0.0a1"
description = "Fast and customizable framework for Causal Inference"
authors = [
    "Dmitry Tikhomirov <dimasta00@gmail.com>",
    "Dmitry Bulychev <dmatryus.sqrt49@yandex.ru>",
    "Ivan Yurashku <yurashku@gmail.com>",
    "Anton Katkov <akatkov89@gmail.com>",
    "Ruslan Alsherov <ruslan-alsherov@yandex.ru>",
    "Ksenia Vasilieva <vasilievaxeniaa@gmail.com>",
    "Anastasiia Fedorova <fedorovanasty24@gmail.com>",
    "Daria Vigovskaya <dasha.vig@yandex.ru>",
    "Danil Shamsutdinov <a.danil.dark@gmail.com>",
    "Eric Ulmaskulov <ulmaskuloverik@gmail.com>"
]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/sb-ai-lab/HypEx"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
# 3.13 is not supported yet: pyspark 3.5 imports np.NaN, which numpy 2 removed,
# and numpy has no 3.13 wheels below 2.1. Revisit with pyspark 4.
python = ">=3.8, <3.13"
tqdm = "*"
scikit-learn = "*"

typing_extensions = {version = ">=4.0", python = "<3.11"}

pandas = [
    { version = ">=1.3.5, <=2.0.3", python = "<3.9" },
    { version = ">=1.3.5, <=2.2.3", python = ">=3.9" }
]

numpy = [
    { version = ">=1.17.0, <=1.24.4", python = "<3.9" },
    { version = ">=1.17.0, <=1.26.4", python = ">=3.9" }
]

scipy = [
    { version = ">=1.5.0, <=1.10.1", python = "<3.9" },
    { version = ">=1.5.0, <=1.13.1", python = ">=3.9" }
]

matplotlib = [
    { version = ">=3.0.0, <=3.7.3", python = "<3.9" },
    { version = ">=3.0.0, <=3.9.0", python = ">=3.9" }
]

faiss-cpu = [
    { version = ">=1.6.0, <=1.8.0", python = "<3.9" },
    { version = ">=1.9.0,<=1.14.0", python = ">=3.9" }
]
seaborn = "<=0.13.2"
statsmodels = "<=0.14.2"
pyspark = "3.5.9"
pyarrow = ">=4.0.0"

catboost = { version = "*", optional = true }
lightgbm = { version = "*", optional = true }

[tool.poetry.extras]
cat = ["catboost"]
lgbm = ["lightgbm"]
all = ["catboost", "lightgbm"]

[tool.poetry.group.dev.dependencies]
docutils = ">=0.17,<0.21"
jupyter = "^1.0.0"
pytest = "^7.4.3"
sphinx = { version = "^7.2.6", python = ">=3.9, <3.11" }
nbsphinx = "*"
nbsphinx_link = "*"
sphinx_autodoc-typehints = "*"
sphinx_rtd_theme = "^1.2.2"
ruff = "0.16.6"
alive-progress = "^3.1.0"
psutil = "^7.0.0"
jsonschema = "^4.23.0"
mypy = ">=1.8.0,<1.17"
pytest-cov = "^5.0.0"
pre-commit = ">=3.5"
causalinference = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py38"
# Ruff >= 0.14 also formats Python blocks inside Markdown; keep it off prose.
extend-exclude = ["docs/_build", "docs/_autosummary", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "UP", "RUF", "I"]
# E501: line length is enforced by `ruff format`, not by the linter.
# RUF001/RUF002/RUF003: strings, docstrings and comments use Greek letters and
# typographic symbols (statistical notation, "×" in shapes).
# C901: complexity is tracked, not gated.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "C901"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export names on purpose.
"__init__.py" = ["F401"]
# Tutorials start Spark in a bare try/except around optional environment setup.
"*.ipynb" = ["E722"]

[tool.codespell]
skip = ".git,.tox,.venv,.mypy_cache,.ruff_cache,docs,_build,imgs,schemes,poetry.lock,*.ipynb"
check-hidden = true
# dotA: a column name in the test fixtures. TE/te: treatment effect.
# TTest/ttest: the class name and the statistic.
ignore-words-list = "dotA,TE,te,TTest,ttest,fpr"

[tool.mypy]
python_version = "3.10"
files = ["hypex"]
exclude = "^(docs|examples|dist)/"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
# Bare `pytest` used to import everything it could find, including
# examples/experiments scripts that are not tests and break collection.
testpaths = ["tests"]
markers = [
    "spark: requires local Spark session (slow)",
    "slow: full pipeline on large data or statistical properties",
    "catboost: requires catboost to be installed",
]
filterwarnings = [
    "error::DeprecationWarning:hypex.*",
    "error::FutureWarning:hypex.*",
]

[tool.coverage.run]
source = ["hypex"]
omit = ["hypex/factory/*", "hypex/hypotheses/*"]

[tool.coverage.report]
show_missing = true
fail_under = 88
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise AbstractMethodError",
]
